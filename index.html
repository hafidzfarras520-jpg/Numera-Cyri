<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numera Cyri — Buku Catatan Literasi Data</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent-cyan: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --border-color: #334155;
      --parchment-bg: #131d31;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Georgia, serif, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
/* Kotak Grid Petunjuk Intro */
    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 20px 0;
      font-size: 0.88rem;
      font-family: 'Segoe UI', sans-serif;
    }

    .guide-item {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #334155;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      line-height: 1.5;
    }
    .game-container {
      width: 100%;
      max-width: 920px;
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      background: #0f172a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-bar h1 { font-size: 1.25rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; font-weight: normal; }

    .stats-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: 'Segoe UI', sans-serif; }
    
    .badge {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .badge-siri { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .badge-timer { background: rgba(239, 68, 68, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
    .badge-chapter { background: rgba(251, 191, 36, 0.15); border-color: var(--accent-gold); color: var(--accent-gold); }

    /* Scene Box & Hotspots */
    .scene-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-size: cover;
      background-position: center;
      border-bottom: 2px solid var(--border-color);
      overflow: hidden;
    }
/* Efek Kritis Siri' Rendah (< 40%) */
    body.critical-siri {
      filter: brightness(0.85);
      transition: filter 0.5s ease;
    }

    body.critical-siri::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      box-shadow: inset 0 0 70px 25px rgba(239, 68, 68, 0.45);
      animation: pulseVignette 1.8s infinite ease-in-out;
    }

    @keyframes pulseVignette {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none !important;
      background: transparent !important;
      transition: background 0.2s;
    }
    .hotspot:hover { background: rgba(56, 189, 248, 0.15) !important; }

    .hotspot-label {
      background: rgba(15, 23, 42, 0.88);
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      pointer-events: none;
      white-space: nowrap;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .quiz-hotspot .hotspot-label { color: var(--accent-gold); border-color: rgba(251, 191, 36, 0.5); }

    /* Layout Konten */
    .game-body {
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    .full-width-body { grid-template-columns: 1fr; }

    .status-panel, .log-panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .log-panel h3 { font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 8px; font-family: 'Segoe UI', sans-serif; }
    .log-list { list-style: none; max-height: 95px; overflow-y: auto; font-size: 0.8rem; color: #94a3b8; font-family: 'Segoe UI', sans-serif; }
    .log-list li { padding: 4px 0; border-bottom: 1px dashed #334155; line-height: 1.4; }
    .log-list li:first-child { color: var(--accent-cyan); }

    /* Intro Hero */
    .intro-hero-panel {
      position: relative;
      border-radius: 16px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .intro-hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('Bg.png');
      background-size: cover;
      background-position: center;
      filter: blur(4px);
      transform: scale(1.05);
      z-index: 0;
    }
    .intro-content { position: relative; z-index: 1; }

    .btn-action {
      background: var(--accent-cyan);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* Modal Pop-up */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 19, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: var(--parchment-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      max-width: 660px;
      width: 100%;
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .book-card {
      background: rgba(15, 23, 42, 0.85);
      border-left: 4px solid var(--accent-cyan);
      padding: 14px 18px;
      border-radius: 8px;
      margin: 12px 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .quiz-option {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s, border-color 0.2s;
      line-height: 1.5;
    }
    .quiz-option:hover { background: #1e293b; border-color: var(--accent-cyan); }
    
    /* Grafik Batang CSS */
    .bar-chart-container {
      position: relative;
      height: 160px;
      border-bottom: 2px solid #64748b;
      margin: 30px 0 30px 10px; 
      width: 260px;
    }
    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      height: 100%;
      padding-left: 10px;
    }
    .chart-bar { width: 36px; background: var(--accent-cyan); border-radius: 4px 4px 0 0; position: relative; }
    .chart-bar.cut-bar { background: var(--accent-red); }
    .bar-label { position: absolute; bottom: -24px; width: 100%; text-align: center; font-size: 0.75rem; color: #cbd5e1; }
    
    .cut-line-green {
      position: absolute; left: 0; right: -80px;
      border-top: 2px dashed var(--accent-green); z-index: 5;
    }
    .cut-line-white {
      position: absolute; left: 0; right: -80px;
      border-top: 2px dashed #f8fafc; z-index: 5;
    }
    .line-lbl {
      position: absolute; right: -5px; top: -12px; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px;
    }
    
    .hidden { display: none !important; }
    .stamp-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-14deg) scale(3);
      border: 6px double #dc2626;
      color: #dc2626;
      font-family: 'Impact', 'Segoe UI Black', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 6px;
      padding: 10px 24px;
      text-transform: uppercase;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.6);
      pointer-events: none;
      z-index: 10000;
      opacity: 0;
      animation: stampSlam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stampSlam {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-25deg) scale(3.5);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-12deg) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-14deg) scale(1);
      }
    }
    #sceneCanvas {
      position: relative;
      overflow: hidden;
    }

    /* Efek pendaran cahaya lilin berkedip di pojok-pojok canvas */
    #sceneCanvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at 15% 85%, rgba(245, 158, 11, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, rgba(217, 119, 6, 0.18) 0%, transparent 40%);
      animation: candleFlicker 3s infinite alternate ease-in-out;
    }

    @keyframes candleFlicker {
      0% {
        opacity: 0.7;
        filter: brightness(0.95);
      }
      50% {
        opacity: 1;
        filter: brightness(1.15);
      }
      100% {
        opacity: 0.8;
        filter: brightness(1);
      }
    }

    /* =========================================================
       LENCANA KHUSUS (SECRET BADGES) DI OUTRO
       ========================================================= */
    .badges-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 12px 0 16px 0;
    }

    .badge-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
      animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .badge-icon {
      font-size: 1.5rem;
    }

    .badge-title {
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 0.88rem;
    }

    .badge-desc {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    @keyframes badgePop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="top-bar">
      <h1>📖 Numera Cyri</h1>
      <div class="stats-bar">
        <div class="badge badge-siri" id="siri-display">Siri': 100%</div>
        <div class="badge badge-timer" id="timer-display">Waktu: 08:00</div>
        <div class="badge badge-chapter" id="chapter-display">Intro</div>
      </div>
    </header>

    <div class="scene-box" id="scene-canvas"></div>

    <main class="game-body" id="game-body">
      <div id="left-panel"></div>
      <aside class="log-panel" id="log-panel">
        <h3>Catatan Jurnal</h3>
        <ul class="log-list" id="journal-log">
          <li>Penyelidikan dimulai.</li>
        </ul>
      </aside>
    </main>
  </div>

  <div class="modal-overlay hidden" id="modal-popup">
    <div class="modal-box">
      <h2 id="modal-title" style="color:var(--accent-cyan); font-size: 1.2rem; margin-bottom:12px; font-family:'Segoe UI', sans-serif;">Lembaran Arsip</h2>
      <div id="modal-body"></div>
      <button class="btn-action" style="margin-top:16px;" id="modal-close-btn" onclick="closeModal()">Tutup Lembaran</button>
    </div>
  </div>

  <script>
  const sounds = {
      bgm: new Audio('bgm.mp4'),
      gameOver: new Audio('gameover.mp4'),
      correct: new Audio('correct.mp4'),
      wrong: new Audio('wrong.mp4'),
      buku: new Audio('buku.mp4'),
      grafik: new Audio('grafik.mp4'),
      lampu: new Audio('lampu.mp4'),
    stamp: new Audio('stamp.mp4')
    };

    // Pengaturan BGM
    sounds.bgm.loop = true;
    sounds.bgm.volume = 0.4;

    function playSound(name) {
      if (sounds[name]) {
        sounds[name].currentTime = 0;
        sounds[name].play().catch(() => {});
      }
    }

    function playBGM() {
      sounds.bgm.play().catch(() => {});
    }

    function stopBGM() {
      sounds.bgm.pause();
      sounds.bgm.currentTime = 0;
    }
    const gameState = {
      chapter: "intro",
      siri: 100,
      timerSec: 480, // 8 Menit
      timerInterval: null,
      hintTimeout: null,
      c1: { stage: 1, solved: false },
      c2: { stage: 1, solved: false },
      c3: { stage: 1, solved: false },
      savedTimeSec: 0
    };

    const sceneCanvas = document.getElementById("scene-canvas");
    const gameBody = document.getElementById("game-body");
    const leftPanel = document.getElementById("left-panel");
    const journalLog = document.getElementById("journal-log");
    const siriDisplay = document.getElementById("siri-display");
    const timerDisplay = document.getElementById("timer-display");
    const chapterDisplay = document.getElementById("chapter-display");
    const modalPopup = document.getElementById("modal-popup");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const logPanel = document.getElementById("log-panel");

    function addLog(text) {
      const li = document.createElement("li");
      li.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
      journalLog.prepend(li);
    }

    function updateSiri(amount) {
      gameState.siri = Math.max(0, Math.min(100, gameState.siri + amount));
      siriDisplay.innerText = `Siri': ${gameState.siri}%`;
      
      // Pengecekan Efek Kritis (< 40%)
      if (gameState.siri < 40 && gameState.siri > 0) {
        document.body.classList.add("critical-siri");
      } else {
        document.body.classList.remove("critical-siri");
      }

      if (gameState.siri === 100) {
        siriDisplay.style.borderColor = "var(--accent-cyan)";
        siriDisplay.style.color = "var(--accent-cyan)";
      }

      if (amount < 0) {
        siriDisplay.style.borderColor = "var(--accent-red)";
        siriDisplay.style.color = "var(--accent-red)";
        if (gameState.siri <= 0) {
          document.body.classList.remove("critical-siri");
          stopBGM();
          playSound('gameOver');
          clearInterval(gameState.timerInterval);
          clearTimeout(gameState.hintTimeout);
          alert("Siri' Kerajaan Hancur! Game Over.");
          location.reload();
        }
      }
    }

    function startTimer(minutes, onExpire) {
      clearInterval(gameState.timerInterval);
      gameState.timerSec = minutes * 60;
      gameState.timerInterval = setInterval(() => {
        gameState.timerSec--;
        const m = String(Math.floor(gameState.timerSec / 60)).padStart(2, "0");
        const s = String(gameState.timerSec % 60).padStart(2, "0");
        timerDisplay.innerText = `Waktu: ${m}:${s}`;
        if (gameState.timerSec <= 0) {
          clearInterval(gameState.timerInterval);
          stopBGM();
          playSound('gameOver');
          onExpire();
        }
      }, 1000);
    }

    function triggerSiriHint(text) {
      clearTimeout(gameState.hintTimeout);
      // Muncul di menit ke-4
      gameState.hintTimeout = setTimeout(() => {
        addLog("Roh Siri' membisikkan petunjuk penting.");
        showModal(
          "Bisikan Roh Siri'",
          `<div class="book-card" style="border-left-color:var(--accent-gold);"><p style="font-style:italic; color:#fde68a;">"${text}"</p></div>`
        );
      }, 4 * 60 * 1000); 
    }

    function showModal(title, htmlContent, customBtnText = "Tutup Lembaran", onBtnClick = null) {
      modalTitle.innerHTML = title;
      modalBody.innerHTML = htmlContent;
      modalCloseBtn.innerText = customBtnText;
      modalCloseBtn.onclick = () => {
        if (onBtnClick) onBtnClick();
        else closeModal();
      };
      modalPopup.classList.remove("hidden");
    }

    function closeModal() { modalPopup.classList.add("hidden"); }

    /* =========================================================
       1. INTRO
       ========================================================= */
function loadIntro() {
  document.body.classList.remove("critical-siri"); // Reset efek redup
  gameState.chapter = "intro";
  gameState.siri = 100;
  gameState.savedTimeSec = 0; // <--- Reset total akumulasi waktu di sini
  gameState.c1.stage = 1; gameState.c1.solved = false;
  gameState.c2.stage = 1; gameState.c2.solved = false;
  gameState.c3.stage = 1; gameState.c3.solved = false;
  clearInterval(gameState.timerInterval);
  clearTimeout(gameState.hintTimeout);
      
      updateSiri(0); 
      chapterDisplay.innerText = "Pendahuluan";
      timerDisplay.innerText = "Waktu: --:--";
      
      sceneCanvas.classList.add("hidden");
      logPanel.classList.add("hidden");
      gameBody.classList.add("full-width-body");

      leftPanel.innerHTML = `
        <div class="intro-hero-panel">
          <div class="intro-content">
            <h2 style="color:var(--accent-gold); font-size:1.4rem; margin-bottom:10px;">Buku Catatan Numera Cyri</h2>
            <div class="book-card" style="border-left-color: var(--accent-gold); background:rgba(15,23,42,0.9);">
              <strong>Siri'</strong> adalah prinsip harga diri, kehormatan, dan kejujuran mutlak. Dalam tata kelola kerajaan, Siri' diwujudkan melalui <strong>kejujuran data pasokan</strong>. Ketika data dimanipulasi, kesucian Siri' tercoreng dan rakyat jatuh dalam krisis.
            </div>
            <p style="font-weight:bold; margin-top:14px; color:var(--accent-cyan); font-family:'Segoe UI', sans-serif;">Panduan Investigasi:</p>
            <div class="guide-grid">
              <div class="guide-item">
                <strong style="color:var(--accent-cyan);">❗ Tanda Seru & Highlight</strong><br>Menandai benda/dokumen yang berisi informasi kasus.
              </div>
              <div class="guide-item">
                <strong style="color:var(--accent-gold);">★ Uji Pemahaman</strong><br>Item utama untuk menjawab kuis evaluasi.
              </div>
              <div class="guide-item">
                <strong style="color:var(--accent-red);">🛡️ Nilai Siri' & Waktu</strong><br>Batas maksimal kesalahan dengan detikan timer 8 menit.
              </div>
              <div class="guide-item">
                <strong style="color:#fde68a;">⏳ Roh Siri' & Log Jurnal</strong><br>Membisikkan petunjuk di menit ke-4 dan mencatat histori temuan.
              </div>
            </div>
            <button class="btn-action" onclick="loadChapter1()">Mulai Investigasi Bab 1 ➔</button>
          </div>
        </div>
      `;
    }
    /* =========================================================
       2. BAB 1: SEBARAN DATA & PENCILAN (OUTLIER)
       ========================================================= */
    function loadChapter1() {
      playBGM(); // <--- TAMBAHKAN INI AGAR MUSIK MULAI BERPUTAR
      gameState.chapter = "c1";
      gameState.c1.stage = 1;
      chapterDisplay.innerText = "Bab 1";
      
      sceneCanvas.classList.remove("hidden");
      logPanel.classList.remove("hidden");
      gameBody.classList.remove("full-width-body");
      sceneCanvas.style.backgroundImage = "url('11.png')";

      addLog("Bab 1 dimulai: Menyelidiki Berkas Pasokan.");
      startTimer(8, () => { alert("Waktu Habis!"); location.reload(); });
      triggerSiriHint("Lihatlah jurang pemisah antara 47 dan 212. Angka yang berdiri terpencil ini punya sebutan khusus.");

      leftPanel.innerHTML = `
        <div class="status-panel">
          <strong>Status Penyelidikan:</strong> Bacalah catatan pasokan dan konsep rentang pada berkas <strong style="color:var(--accent-cyan);">[ ! ]</strong>, lalu selesaikan evaluasi di meja arsip <strong style="color:var(--accent-gold);">[ ★ ]</strong>.
        </div>
      `;

      sceneCanvas.innerHTML = `
        <div class="hotspot" style="top: 65%; left: 14%; width: 22%; height: 26%;" onclick="viewDocA()">
          <span class="hotspot-label">❗ Pasokan Pangan</span>
        </div>
        <div class="hotspot" style="top: 25%; left: 60%; width: 22%; height: 24%;" onclick="viewDocB()">
          <span class="hotspot-label">❗ Konsep Rentang</span>
        </div>
        <div class="hotspot quiz-hotspot" style="top: 40%; left: 32%; width: 28%; height: 42%;" onclick="openChapter1Quiz()">
          <span class="hotspot-label">★ Evaluasi Bab 1</span>
        </div>
      `;
    }

function viewDocA() {
  playSound('buku');
  addLog("Membaca rincian pasokan pangan.");
      showModal(
        "Catatan Logistik: Pasokan Wilayah",
        `
          <p>Tercatat data pasokan pangan gandum untuk 4 wilayah luar kerajaan:</p>
          <div style="text-align:center; font-size:1.3rem; font-weight:bold; color:var(--accent-cyan); margin:12px 0;">
            44, 44, 48, 52 ton
          </div>
          <div class="book-card">
            <strong>Cara Menentukan Rata-Rata (Mean):</strong><br><br>

        `

            • <strong>Hari 3:</strong> Pertemuan rahasia persekongkolan logistik oleh Adipati.<br>
            • <strong>Hari 5:</strong> Pasokan 212 ton dialihkan paksa ke Ibukota.<br>
            • <strong>Hari 7:</strong> Laporan dimanipulasi dengan pemotongan grafik.<br>
            • <strong>Hari 9:</strong> Dampak krisis kelaparan rakyat memuncak.<br><br>
            <span style="color:var(--accent-gold);">Syarat Mutlak Kausalitas:</span> Penyebab (Hari 5) HARUS terjadi mendahului Akibat (Hari 9).
          </div>
        `
      );
    }

    function openChapter3Quiz() {
      playSound('buku');
      if (gameState.c3.stage === 1) {
        showModal(
          "Evaluasi Tahap 1: Arah Waktu",
          `
            <p>Mungkinkah penderitaan kelaparan rakyat di <strong>Hari 9</strong> yang menyebabkan Adipati memindahkan pasokan di <strong>Hari 5</strong>?</p>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mungkin1')">A. Mungkin, karena terjadi berdekatan di bulan sama.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mungkin2')">B. Mungkin, asalkan ada saksi mata yang melihat.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'pasti')">C. Pasti, karena angka 9 lebih besar dari angka 5.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mustahil')">D. Mustahil, akibat tidak bisa mendahului sebabnya.</button>
          `,
          "Tutup"
        );
      } else if (gameState.c3.stage === 2) {
        showModal(
          "Evaluasi Tahap 2: Korelasi vs Kausalitas",
          `
            <p>Adipati berkilah krisis pangan hanya kebetulan (korelasi semu) akibat cuaca. Bukti mana yang memastikan ini adalah Kausalitas murni?</p>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'otomatis')">A. Semua kejadian berurutan pasti otomatis saling memicu.</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'firasat')">B. Rakyat desa punya firasat bahwa Adipati pelakunya.</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'bersama')">C. Kejadian buruk bersamaan pasti saling memengaruhi.</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'kausalitas')">D. Ada mekanisme nyata yang mengikat kedua kejadian.</button>
          `,
          "Tutup"
        );
      } else {
        showModal(
          "Evaluasi Tahap 3: Kesimpulan",
          `
            <p>Berdasarkan bukti mekanisme fisik dan prinsip urutan waktu, siapakah dalang utama penyebab hancurnya Siri' Kerajaan?</p>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah1')">A. Rakyat desa panik dan menciptakan krisis suasana.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah2')">B. Pejabat pembuat grafik yang menggambar data laporannya.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah3')">C. Cuaca buruk yang kebetulan datang melanda desa.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'benar')">D. Adipati yang menyita dan memindahkan pasokan.</button>
          `,
          "Tutup"
        );
      }
    }

function submitC3Quiz(stage, choice) {
  if (stage === 1) {
    if (choice === 'mustahil') {
      playSound('correct'); // <--- Audio Jawaban Benar
      gameState.c3.stage = 2;
      addLog("Tahap 1 Berhasil: Urutan waktu dipahami.");
      showModal("Logika Kronologis Sah!", `<div class="book-card" style="border-left-color: var(--accent-green);">Tepat! Waktu hanya berjalan maju. Syarat utama Kausalitas adalah <strong>Sebab harus mendahului akibat</strong>.</div>`, "Lanjut ke Tahap 2", () => openChapter3Quiz());
    } else {
      playSound('wrong'); // <--- Audio Jawaban Salah
      updateSiri(-10);
      let reason = "";
      if (choice === 'mungkin1' || choice === 'mungkin2') reason = "Waktu tidak berjalan mundur. Hari 9 tidak mungkin menjadi penyebab Hari 5.";
      if (choice === 'pasti') reason = "Besarnya angka (9 > 5) justru membuktikan bahwa Hari 5 terjadi lebih dahulu.";
      addLog("Tahap 1 keliru.");
      showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
    }
  } else if (stage === 2) {
    if (choice === 'kausalitas') {
      playSound('correct'); // <--- Audio Jawaban Benar
      gameState.c3.stage = 3;
      addLog("Tahap 2 Berhasil: Kausalitas dibuktikan.");
      showModal("Alibi Dipatahkan!", `<div class="book-card" style="border-left-color: var(--accent-green);">Luar biasa! Urutan waktu yang tepat ditambah <strong>mekanisme fisik pengikat</strong> mengonfirmasi Kausalitas sejati.</div>`, "Lanjut ke Kesimpulan", () => openChapter3Quiz());
    } else {
      playSound('wrong'); // <--- Audio Jawaban Salah
      updateSiri(-10);
      let reason = "";
      if (choice === 'otomatis') reason = "Tidak semua kejadian berurutan adalah sebab-akibat (ayam berkokok mendahului fajar, tapi bukan ayam penyebab matahari terbit). Urutan butuh mekanisme.";
      if (choice === 'firasat') reason = "Firasat bukan bukti statistika yang sah.";
      if (choice === 'bersama') reason = "Kejadian bersamaan (korelasi semu) butuh mekanisme penghubung fisik agar terbukti sebagai kausalitas.";
      addLog("Tahap 2 keliru.");
      showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
    }
  } else {
    if (choice === 'benar') {
      gameState.c3.solved = true;
      clearInterval(gameState.timerInterval);
      gameState.savedTimeSec = (gameState.savedTimeSec || 0) + gameState.timerSec; // <--- Simpan sisa waktu Bab 3
      addLog("Bab 3 Selesai: Vonis dijatuhkan.");

      // Efek stempel bukti sah sebelum vonis ditampilkan
      triggerStampEffect(() => {
        playSound('correct');
        showModal(
          "Vonis Ditegakkan!",
          `<div class="book-card" style="border-left-color: var(--accent-green);">
            Sempurna! Dengan stempel bukti sah, Adipati resmi dijatuhi hukuman dan seluruh pasokan pangan dikembalikan ke rakyat yang berhak.
          </div>`,
          "Buka Kemenangan ➔",
          () => { closeModal(); loadOutro(); }
        );
      });
    } else {
      playSound('wrong'); // <--- Audio Jawaban Salah
      updateSiri(-10);
      let reason = "";
      if (choice === 'salah1') reason = "Rakyat yang menderita hanyalah korban (Akibat akhir), bukan penyebab masalah.";
      if (choice === 'salah2') reason = "Pembuat grafik hanya menutupi kejahatan yang sudah terjadi, bukan pemicu utama.";
      if (choice === 'salah3') reason = "Cuaca buruk hanyalah alibi kebetulan untuk menutupi penyitaan.";
      addLog("Tahap 3 keliru.");
      showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
    }
  }
}
    function triggerStampEffect(callback) {
      playSound('stamp');
      
      const stampEl = document.createElement('div');
      stampEl.className = 'stamp-overlay';
      stampEl.innerText = 'BUKTI SAH';
      document.body.appendChild(stampEl);

      // Beri jeda 800ms agar pemain menikmati efeknya sebelum membuka modal
      setTimeout(() => {
        stampEl.remove();
        if (callback) callback();
      }, 800);
    }

    /* =========================================================
       5. OUTRO
       ========================================================= */
    function loadOutro() {
      stopBGM();
      gameState.chapter = "outro";
      chapterDisplay.innerText = "Selesai: Penghakiman";
      
      const remainingSec = gameState.timerSec;
      const m = String(Math.floor(remainingSec / 60)).padStart(2, "0");
      const s = String(remainingSec % 60).padStart(2, "0");
      timerDisplay.innerText = `Selesai: ${m}:${s}`;
      
      sceneCanvas.classList.add("hidden");
      logPanel.classList.add("hidden");
      gameBody.classList.add("full-width-body");

      // Penentuan Gelar, Warna, dan Ulasan
      let title = "";
      let titleColor = "";
      let feedback = "";

      if (gameState.siri === 0) {
        title = "Integritas Runtuh (Gagal)";
        titleColor = "var(--accent-red)";
        feedback = "Kecurangan menang. Kesucian Siri' kerajaan hancur akibat banyaknya kesalahan analisis.";
      } else if (gameState.siri >= 10 && gameState.siri <= 30) {
        title = "Penyelidik Ceroboh";
        titleColor = "#f87171";
        feedback = "Kasus terselesaikan dengan susah payah. Banyak bukti dan kausalitas yang sempat salah ditafsirkan.";
      } else if (gameState.siri >= 40 && gameState.siri <= 60) {
        title = "Pemberantas Bias Pemula";
        titleColor = "#fde047";
        feedback = "Analisis cukup baik. Kamu berhasil melihat trik manipulasi grafik dan pencilan data.";
      } else if (gameState.siri >= 70 && gameState.siri <= 80) {
        title = "Penjaga Kebenaran Data";
        titleColor = "var(--accent-cyan)";
        feedback = "Sangat tajam! Manipulasi sumbu dan pemalsuan waktu berhasil dibongkar dengan bukti kokoh.";
      } else {
        title = "Penyelidik Mahir Siri'";
        titleColor = "var(--accent-gold)";
        feedback = "Luar biasa tanpa cela! Integritas Siri' terjaga murni dan keadilan statistik tegak sempurna di seluruh kerajaan.";
      }

      // Evaluasi Lencana Khusus (Secret Badges)
      let badgesHTML = "";
      let earnedBadges = [];

      // Lencana 1: Mata Rajawali (Siri' 100% tanpa salah)
      if (gameState.siri === 100) {
        earnedBadges.push(`
          <div class="badge-card">
            <span class="badge-icon">🦅</span>
            <div style="text-align: left;">
              <div class="badge-title">Mata Rajawali</div>
              <div class="badge-desc">Menjawab sempurna tanpa satupun kesalahan (Siri' 100%).</div>
            </div>
          </div>
        `);
      }

    const totalSaved = gameState.savedTimeSec || 0;
      if (totalSaved >= 480) { // Ganti ke 600 jika ingin standar 10 menit
        const savedMin = Math.floor(totalSaved / 60);
        earnedBadges.push(`
          <div class="badge-card">
            <span class="badge-icon">⚡</span>
            <div style="text-align: left;">
              <div class="badge-title">Penyelidik Gesit</div>
              <div class="badge-desc">Deduksi kilat! Mengumpulkan total sisa waktu ${savedMin}+ menit dari seluruh bab.</div>
            </div>
          </div>
        `);
      }

      if (earnedBadges.length > 0) {
        badgesHTML = `
          <div style="margin-top: 14px;">
            <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Lencana Penghargaan Diperoleh:</div>
            <div class="badges-container">
              ${earnedBadges.join("")}
            </div>
          </div>
        `;
      }

      leftPanel.innerHTML = `
        <div class="intro-hero-panel" style="text-align: center;">
          <div class="intro-content">
            <h2 style="color: var(--accent-green); margin-bottom: 8px; font-family:'Segoe UI', sans-serif;">🎉 Kemakmuran Kerajaan Pulih</h2>
            
            <!-- Kotak Gelar Hasil Investigasi -->
            <div class="book-card" style="border-left-color: ${titleColor}; background: rgba(15,23,42,0.95); max-width: 600px; margin: 0 auto 16px auto; text-align: left;">
              <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Evaluasi Penyelidik:</div>
              <div style="font-size: 1.25rem; font-weight: bold; color: ${titleColor}; margin: 4px 0 6px 0;">
                ★ ${title} ★
              </div>
              <div style="font-size: 0.92rem; color: #f8fafc; margin-bottom: 6px;">
                Sisa Nilai Siri': <strong style="color: ${titleColor};">${gameState.siri}%</strong> | Sisa Waktu: <strong>${m}:${s}</strong>
              </div>
              <p style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; margin: 0;">
                ${feedback}
              </p>
              ${badgesHTML}
            </div>

            <!-- Rangkuman Buku Catatan -->
            <div class="book-card" style="text-align: left; max-width: 600px; margin: 0 auto 16px auto;">
              <strong>Buku Catatan Literasi Data Selesai Ditulis:</strong><br><br>
              • <strong>Bab 1:</strong> Memahami sebaran data, menghitung rentang, dan mendeteksi bahaya angka <strong>Pencilan (Outlier)</strong> yang menarik rata-rata dan menutupi kekurangan pihak lain.<br><br>
              • <strong>Bab 2:</strong> Membongkar manipulasi pemotongan skala visual grafik, serta mengutamakan nilai <strong>Median</strong> agar titik tengah kebal terhadap angka ekstrem.<br><br>
              • <strong>Bab 3:</strong> Membuktikan <strong>Kausalitas (Sebab-Akibat)</strong> dengan memastikan adanya bukti mekanisme fisik dan sebab kronologis yang mendahului akibatnya.
            </div>

            <button class="btn-action" onclick="loadIntro()" style="max-width: 240px; margin: 0 auto;">Tutup Buku Catatan ➔</button>
          </div>
        </div>
      `;
    }

    loadIntro();
  </script>
</body>
</html>
