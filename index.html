<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numera Cyri — Buku Catatan Literasi Data</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent-cyan: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --border-color: #334155;
      --parchment-bg: #131d31;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Georgia, serif, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 20px 0;
      font-size: 0.88rem;
      font-family: 'Segoe UI', sans-serif;
    }

    .guide-item {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #334155;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      line-height: 1.5;
    }

    .game-container {
      width: 100%;
      max-width: 920px;
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #0f172a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-bar h1 { font-size: 1.25rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; font-weight: normal; }
    .stats-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: 'Segoe UI', sans-serif; }
    
    .badge {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .badge-siri { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .badge-timer { background: rgba(239, 68, 68, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
    .badge-chapter { background: rgba(251, 191, 36, 0.15); border-color: var(--accent-gold); color: var(--accent-gold); }

    .scene-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-size: cover;
      background-position: center;
      border-bottom: 2px solid var(--border-color);
      overflow: hidden;
    }

    body.critical-siri { filter: brightness(0.85); transition: filter 0.5s ease; }
    body.critical-siri::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      box-shadow: inset 0 0 70px 25px rgba(239, 68, 68, 0.45);
      animation: pulseVignette 1.8s infinite ease-in-out;
    }

    @keyframes pulseVignette {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none !important;
      background: transparent !important;
      transition: background 0.2s;
    }
    .hotspot:hover { background: rgba(56, 189, 248, 0.15) !important; }

    .hotspot-label {
      background: rgba(15, 23, 42, 0.88);
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      pointer-events: none;
      white-space: nowrap;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .quiz-hotspot .hotspot-label { color: var(--accent-gold); border-color: rgba(251, 191, 36, 0.5); }
    .quiz-hotspot.locked { opacity: 0.6; }
    .quiz-hotspot.locked .hotspot-label { color: #94a3b8; border-color: #64748b; }

    .game-body {
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    .full-width-body { grid-template-columns: 1fr; }

    .status-panel, .log-panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .log-panel h3 { font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 8px; font-family: 'Segoe UI', sans-serif; }
    .log-list { list-style: none; max-height: 95px; overflow-y: auto; font-size: 0.8rem; color: #94a3b8; font-family: 'Segoe UI', sans-serif; }
    .log-list li { padding: 4px 0; border-bottom: 1px dashed #334155; line-height: 1.4; }
    .log-list li:first-child { color: var(--accent-cyan); }

    .intro-hero-panel {
      position: relative;
      border-radius: 16px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .intro-hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('Bg.png');
      background-size: cover;
      background-position: center;
      filter: blur(4px);
      transform: scale(1.05);
      z-index: 0;
    }
    .intro-content { position: relative; z-index: 1; }

    .btn-action {
      background: var(--accent-cyan);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 19, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: var(--parchment-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      max-width: 660px;
      width: 100%;
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .book-card {
      background: rgba(15, 23, 42, 0.85);
      border-left: 4px solid var(--accent-cyan);
      padding: 14px 18px;
      border-radius: 8px;
      margin: 12px 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .quiz-option {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s, border-color 0.2s;
      line-height: 1.5;
    }
    .quiz-option:hover { background: #1e293b; border-color: var(--accent-cyan); }
    
    .hidden { display: none !important; }
    
    .stamp-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-14deg) scale(3);
      border: 6px double #dc2626;
      color: #dc2626;
      font-family: 'Impact', 'Segoe UI Black', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 6px;
      padding: 10px 24px;
      text-transform: uppercase;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.6);
      pointer-events: none;
      z-index: 10000;
      opacity: 0;
      animation: stampSlam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stampSlam {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-25deg) scale(3.5); }
      80% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1); }
    }

    #sceneCanvas { position: relative; overflow: hidden; }
    #sceneCanvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at 15% 85%, rgba(245, 158, 11, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, rgba(217, 119, 6, 0.18) 0%, transparent 40%);
      animation: candleFlicker 3s infinite alternate ease-in-out;
    }

    @keyframes candleFlicker {
      0% { opacity: 0.7; filter: brightness(0.95); }
      50% { opacity: 1; filter: brightness(1.15); }
      100% { opacity: 0.8; filter: brightness(1); }
    }

    .badges-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 12px 0 16px 0;
    }

    .badge-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
      animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .badge-icon { font-size: 1.5rem; }
    .badge-title { font-weight: bold; color: var(--accent-gold); font-size: 0.88rem; }
    .badge-desc { font-size: 0.75rem; color: #94a3b8; }

    @keyframes badgePop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* DRAG AND DROP ZONES (BAB 1) - Warna Netral Seragam */
    .drag-bag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #1e293b;
      border: 1.5px solid #64748b;
      color: #f8fafc;
      border-radius: 6px;
      cursor: grab;
      font-weight: 500;
      font-size: 0.85rem;
      user-select: none;
      touch-action: none;
    }
    .drag-bag:active { cursor: grabbing; opacity: 0.7; }
    .drop-box {
      border: 2px dashed #475569;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      padding: 10px;
      min-height: 64px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-box.drag-over { border-color: var(--accent-gold); background: rgba(251, 191, 36, 0.15); }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="top-bar">
      <h1>📖 Numera Cyri</h1>
      <div class="stats-bar">
        <div class="badge badge-siri" id="siri-display">Siri': 100%</div>
        <div class="badge badge-timer" id="timer-display">Waktu: 08:00</div>
        <div class="badge badge-chapter" id="chapter-display">Intro</div>
      </div>
    </header>

    <div class="scene-box" id="scene-canvas"></div>

    <main class="game-body" id="game-body">
      <div id="left-panel"></div>
      <aside class="log-panel" id="log-panel">
        <h3>Catatan Jurnal</h3>
        <ul class="log-list" id="journal-log">
          <li>Penyelidikan dimulai.</li>
        </ul>
      </aside>
    </main>
  </div>

  <div class="modal-overlay hidden" id="modal-popup">
    <div class="modal-box">
      <h2 id="modal-title" style="color:var(--accent-cyan); font-size: 1.2rem; margin-bottom:12px; font-family:'Segoe UI', sans-serif;">Lembaran Arsip</h2>
      <div id="modal-body"></div>
      <button class="btn-action" style="margin-top:16px;" id="modal-close-btn" onclick="closeModal()">Tutup Lembaran</button>
    </div>
  </div>

  <script>
    const sounds = {
      bgm: new Audio('bgm.mp4'),
      gameOver: new Audio('gameover.mp4'),
      correct: new Audio('correct.mp4'),
      wrong: new Audio('wrong.mp4'),
      buku: new Audio('buku.mp4'),
      grafik: new Audio('grafik.mp4'),
      lampu: new Audio('lampu.mp4'),
      stamp: new Audio('stamp.mp4')
    };

    sounds.bgm.loop = true;
    sounds.bgm.volume = 0.75;

    function playSound(name) {
      if (sounds[name]) {
        sounds[name].currentTime = 0;
        sounds[name].play().catch(() => {});
      }
    }

    function playBGM() { sounds.bgm.play().catch(() => {}); }
    function stopBGM() { sounds.bgm.pause(); sounds.bgm.currentTime = 0; }

    const gameState = {
      chapter: "intro",
      siri: 100,
      timerSec: 480,
      timerInterval: null,
      hintTimeout: null,
      c1: { stage: 1, solved: false, ready: false },
      c2: { stage: 1, solved: false, ready: false },
      c3: { stage: 1, solved: false, ready: false },
      savedTimeSec: 0
    };

    const sceneCanvas = document.getElementById("scene-canvas");
    const gameBody = document.getElementById("game-body");
    const leftPanel = document.getElementById("left-panel");
    const journalLog = document.getElementById("journal-log");
    const siriDisplay = document.getElementById("siri-display");
    const timerDisplay = document.getElementById("timer-display");
    const chapterDisplay = document.getElementById("chapter-display");
    const modalPopup = document.getElementById("modal-popup");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const logPanel = document.getElementById("log-panel");

    function addLog(text) {
      const li = document.createElement("li");
      li.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
      journalLog.prepend(li);
    }

    function updateSiri(amount) {
      gameState.siri = Math.max(0, Math.min(100, gameState.siri + amount));
      siriDisplay.innerText = `Siri': ${gameState.siri}%`;
      
      if (gameState.siri < 40 && gameState.siri > 0) {
        document.body.classList.add("critical-siri");
      } else {
        document.body.classList.remove("critical-siri");
      }

      if (gameState.siri === 100) {
        siriDisplay.style.borderColor = "var(--accent-cyan)";
        siriDisplay.style.color = "var(--accent-cyan)";
      }

      if (amount < 0) {
        siriDisplay.style.borderColor = "var(--accent-red)";
        siriDisplay.style.color = "var(--accent-red)";
        if (gameState.siri <= 0) {
          document.body.classList.remove("critical-siri");
          stopBGM();
          playSound('gameOver');
          clearInterval(gameState.timerInterval);
          clearTimeout(gameState.hintTimeout);
          
          showModal(
            "<span style='color:var(--accent-red);'>Siri' Runtuh! Game Over</span>",
            `<div class="book-card" style="border-left-color:var(--accent-red);">
              Nilai Siri' kerajaan telah habis (0%). Kehormatan dan integritas data gagal diselamatkan.
            </div>`,
            "Ulangi Investigasi ↺",
            () => { closeModal(); loadIntro(); }
          );
          return true;
        }
      }
      return false;
    }

    function startTimer(minutes, onExpire) {
      clearInterval(gameState.timerInterval);
      gameState.timerSec = minutes * 60;
      gameState.timerInterval = setInterval(() => {
        gameState.timerSec--;
        const m = String(Math.floor(gameState.timerSec / 60)).padStart(2, "0");
        const s = String(gameState.timerSec % 60).padStart(2, "0");
        timerDisplay.innerText = `Waktu: ${m}:${s}`;
        if (gameState.timerSec <= 0) {
          clearInterval(gameState.timerInterval);
          stopBGM();
          playSound('gameOver');
          if (onExpire) {
            onExpire();
          } else {
            showModal(
              "<span style='color:var(--accent-red);'>Waktu Habis!</span>",
              `<div class="book-card" style="border-left-color:var(--accent-red);">
                Waktu penyelidikan telah habis. Kebenaran gagal diungkap tepat waktu.
              </div>`,
              "Ulangi Investigasi ↺",
              () => { closeModal(); loadIntro(); }
            );
          }
        }
      }, 1000);
    }

    function triggerSiriHint(text) {
      clearTimeout(gameState.hintTimeout);
      gameState.hintTimeout = setTimeout(() => {
        addLog("Roh Siri' membisikkan petunjuk penting.");
        showModal(
          "Bisikan Roh Siri'",
          `<div class="book-card" style="border-left-color:var(--accent-gold);"><p style="font-style:italic; color:#fde68a;">"${text}"</p></div>`
        );
      }, 4 * 60 * 1000); 
    }

    function showModal(title, htmlContent, customBtnText = "Tutup Lembaran", onBtnClick = null) {
      modalTitle.innerHTML = title;
      modalBody.innerHTML = htmlContent;
      modalCloseBtn.innerText = customBtnText;
      modalCloseBtn.onclick = () => {
        if (onBtnClick) onBtnClick();
        else closeModal();
      };
      modalPopup.classList.remove("hidden");
    }

    function closeModal() { modalPopup.classList.add("hidden"); }

    /* =========================================================
       1. INTRO
       ========================================================= */
    function loadIntro() {
      document.body.classList.remove("critical-siri");
      gameState.chapter = "intro";
      gameState.siri = 100;
      gameState.savedTimeSec = 0;
      gameState.c1.stage = 1; gameState.c1.solved = false; gameState.c1.ready = false;
      gameState.c2.stage = 1; gameState.c2.solved = false; gameState.c2.ready = false;
      gameState.c3.stage = 1; gameState.c3.solved = false; gameState.c3.ready = false;
      clearInterval(gameState.timerInterval);
      clearTimeout(gameState.hintTimeout);
      
      updateSiri(0); 
      chapterDisplay.innerText = "Pendahuluan";
      timerDisplay.innerText = "Waktu: --:--";
      
      sceneCanvas.classList.add("hidden");
      logPanel.classList.add("hidden");
      gameBody.classList.add("full-width-body");

      leftPanel.innerHTML = `
        <div class="intro-hero-panel">
          <div class="intro-content">
            <h2 style="color:var(--accent-gold); font-size:1.4rem; margin-bottom:10px;">Buku Catatan Numera Cyri</h2>
            <div class="book-card" style="border-left-color: var(--accent-gold); background:rgba(15,23,42,0.9);">
              <strong>Siri'</strong> adalah prinsip harga diri, kehormatan, dan kejujuran mutlak. Dalam tata kelola kerajaan, Siri' diwujudkan melalui <strong>kejujuran data pasokan</strong>. Ketika data dimanipulasi, kesucian Siri' tercoreng dan rakyat jatuh dalam krisis.
            </div>
            <p style="font-weight:bold; margin-top:14px; color:var(--accent-cyan); font-family:'Segoe UI', sans-serif;">Panduan Investigasi:</p>
            <div class="guide-grid">
              <div class="guide-item">
                <strong style="color:var(--accent-cyan);">❗ Interaksi Barang Bukti</strong><br>Sortir karung pasokan, bongkar manipulasi grafik, dan buktikan kausalitas.
              </div>
              <div class="guide-item">
                <strong style="color:var(--accent-gold);">★ Uji Pemahaman</strong><br>Terkunci sampai kamu menyelesaikan penyelidikan bukti [ ! ].
              </div>
              <div class="guide-item">
                <strong style="color:var(--accent-red);">🛡️ Nilai Siri' & Waktu</strong><br>Batas maksimal kesalahan dengan detikan timer 8 menit per bab.
              </div>
              <div class="guide-item">
                <strong style="color:#fde68a;">⏳ Roh Siri' & Log Jurnal</strong><br>Membisikkan petunjuk di menit ke-4 dan mencatat histori temuan.
              </div>
            </div>
            <button class="btn-action" onclick="loadChapter1()">Mulai Investigasi Bab 1 ➔</button>
          </div>
        </div>
      `;
    }

    /* =========================================================
       2. BAB 1: SEBARAN DATA & PENCILAN (OUTLIER)
       ========================================================= */
    function loadChapter1() {
      playBGM();
      gameState.chapter = "c1";
      gameState.c1.stage = 1;
      gameState.c1.ready = false;
      chapterDisplay.innerText = "Bab 1";
      
      sceneCanvas.classList.remove("hidden");
      logPanel.classList.remove("hidden");
      gameBody.classList.remove("full-width-body");
      sceneCanvas.style.backgroundImage = "url('11.png')";

      addLog("Bab 1 dimulai: Menyelidiki Berkas Pasokan.");
      startTimer(8);
      triggerSiriHint("Lihatlah jurang pemisah antara 47 dan 212. Angka yang berdiri terpencil ini punya sebutan khusus.");

      leftPanel.innerHTML = `
        <div class="status-panel">
          <strong>Status Penyelidikan:</strong> Periksa dan sortir karung pasokan pada berkas <strong style="color:var(--accent-cyan);">[ ! ]</strong> untuk membuka sidang evaluasi meja arsip <strong style="color:var(--accent-gold);">[ ★ ]</strong>.
        </div>
      `;

      renderChapter1Hotspots();
    }

    function renderChapter1Hotspots() {
      const quizLockedClass = gameState.c1.ready ? "" : "locked";
      const quizLabel = gameState.c1.ready ? "★ Evaluasi Bab 1" : "🔒 Evaluasi (Terkunci)";
      
      sceneCanvas.innerHTML = `
        <div class="hotspot" style="top: 65%; left: 14%; width: 22%; height: 26%;" onclick="viewDocA()">
          <span class="hotspot-label">❗ Sortir Karung Pasokan</span>
        </div>
        <div class="hotspot" style="top: 25%; left: 60%; width: 22%; height: 24%;" onclick="viewDocB()">
          <span class="hotspot-label">❗ Konsep Rentang</span>
        </div>
        <div class="hotspot quiz-hotspot ${quizLockedClass}" style="top: 40%; left: 32%; width: 28%; height: 42%;" onclick="openChapter1Quiz()">
          <span class="hotspot-label">${quizLabel}</span>
        </div>
      `;
    }

    function viewDocA() {
      playSound('buku');
      addLog("Membuka meja sortir pasokan pangan.");
      showModal(
        "Pemeriksaan Lumbung: Pisahkan Karung yang Janggal",
        `
          <p style="margin-bottom:8px;">Pindahkan karung dari sumber ke dalam kotak yang sesuai:</p>
          
          <div style="font-size:0.8rem; color:#94a3b8; margin-top:6px;">Karung Pasokan Terdata:</div>

    function allowDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragStart(e) {
      e.dataTransfer.setData("text/plain", e.target.id);
    }

    function handleDrop(e, targetZone) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const bagId = e.dataTransfer.getData("text/plain");
      const bagEl = document.getElementById(bagId);
      if (!bagEl) return;

      const val = parseInt(bagEl.getAttribute('data-val'));

      if (targetZone === 'normal' && val === 212) {
        playSound('wrong');
        updateSiri(-5);
        document.getElementById('c1-sort-feedback').innerHTML = `<span style="color:var(--accent-red);">Keliru! Nilai 212 Ton terlalu jauh terasing dibanding lainnya. Karung ini janggal! (-5% Siri')</span>`;
        return;
      }
      if (targetZone === 'outlier' && val !== 212) {
        playSound('wrong');
        updateSiri(-5);
        document.getElementById('c1-sort-feedback').innerHTML = `<span style="color:var(--accent-red);">Keliru! ${val} Ton berada di kelompok wajar (rentang 44-52 Ton). (-5% Siri')</span>`;
        return;
      }

      e.currentTarget.appendChild(bagEl);
      playSound('correct');
      checkC1SortComplete();
    }

          gameState.c2.stage = 3;
          addLog("Tahap 2 Berhasil: Median dipilih.");
          showModal("Keputusan Tepat!", `<div class="book-card" style="border-left-color: var(--accent-green);">Bagus! Saat ada angka pencilan raksasa, Median (Nilai Tengah) adalah satu-satunya ukuran yang netral mewakili mayoritas.</div>`, "Lanjut ke Tahap 3", () => openChapter2Quiz());
        } else {
          playSound('wrong');
          if (updateSiri(-10)) return;
          let reason = "";
          if (choice === 'mean') reason = "Menggunakan Mean di sini hanya menguntungkan si penimbun karena nilainya ditarik naik oleh angka ekstrem.";
          if (choice === 'modus') reason = "Modus tidak dipilih berdasarkan simpati, melainkan karena ia tidak mewakili titik pusat data keseluruhan.";
          if (choice === 'max') reason = "Maksimum hanya melihat satu titik puncak ekstrem.";
          addLog("Tahap 2 keliru.");
          showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter2Quiz());
        }
      } else {
        if (choice === 'benar') {
          playSound('correct');
          gameState.c2.solved = true;
          gameState.savedTimeSec = (gameState.savedTimeSec || 0) + gameState.timerSec;
          addLog("Bab 2 Selesai: Manipulasi sumbu grafik dan peran median tuntas.");
          showModal(
            "Evaluasi Bab 2 Selesai!",
            `<div class="book-card" style="border-left-color: var(--accent-green);">
              Sangat kritis! Kita tetap mengakui keberadaan data pencilan 212, namun kita tidak membiarkan nilai tersebut menyesatkan simpulan untuk sisa kelompok.
            </div>`,
            "Buka Bab 3 ➔",
            () => { closeModal(); loadChapter3(); }
          );
        } else {
          playSound('wrong');
          if (updateSiri(-10)) return;
          let reason = "";
          if (choice === 'salah1') reason = "Data 212 ton adalah realita lapangan (korupsi), bukan salah tulis, jadi pantang dihapus.";
          if (choice === 'salah2') reason = "Statistika tidak membenarkan pembagian nilai asli secara sewenang-wenang.";
          if (choice === 'salah3') reason = "Mencari angka kembar (Modus) tidak membuktikan keseimbangan titik pusat.";
          addLog("Tahap 3 keliru.");
          showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter2Quiz());
        }
      }
    }

    /* =========================================================
       4. BAB 3: KORELASI VS KAUSALITAS
       ========================================================= */
    function loadChapter3() {
      gameState.chapter = "c3";
      gameState.c3.stage = 1;
      gameState.c3.ready = false;
      chapterDisplay.innerText = "Bab 3";
      sceneCanvas.style.backgroundImage = "url('31.png')";

      addLog("Bab 3 dimulai: Sidang Pembuktian.");
      startTimer(8);
      clearTimeout(gameState.hintTimeout);
      triggerSiriHint("Banyak hal terjadi bersamaan (Korelasi). Kausalitas butuh bukti fisik pengikat dan urutan waktu yang pasti.");

      leftPanel.innerHTML = `
        <div class="status-panel">
          <strong>Status Penyelidikan:</strong> Susun rantai sebab-akibat pada linimasa <strong style="color:var(--accent-cyan);">[ ! ]</strong> untuk membuka sidang vonis Singgasana Raja <strong style="color:var(--accent-gold);">[ ★ ]</strong>.
        </div>
      `;

      renderChapter3Hotspots();
    }

    function renderChapter3Hotspots() {
      const quizLockedClass = gameState.c3.ready ? "" : "locked";
      const quizLabel = gameState.c3.ready ? "★ Singgasana Sidang" : "🔒 Sidang (Terkunci)";

      sceneCanvas.innerHTML = `
        <div class="hotspot" style="top: 55%; left: 10%; width: 22%; height: 35%;" onclick="viewWarehouseAudit()">
          <span class="hotspot-label">❗ Bukti Aliran Nyata</span>
        </div>
        <div class="hotspot" style="top: 55%; left: 38%; width: 22%; height: 35%;" onclick="viewTimelineAudit()">
          <span class="hotspot-label">❗ Rekonstruksi Kausalitas</span>
        </div>
        <div class="hotspot quiz-hotspot ${quizLockedClass}" style="top: 15%; left: 68%; width: 26%; height: 70%;" onclick="openChapter3Quiz()">
          <span class="hotspot-label">${quizLabel}</span>
        </div>
      `;
    }

    function viewWarehouseAudit() {
      playSound('buku');
      addLog("Menemukan bukti perpindahan fisik pangan.");
      showModal(
        "Berkas Bukti: Perpindahan Fisik",
        `
          <div class="book-card">
            Ditemukan surat perintah penyitaan stempel Adipati. Sebanyak <strong>212 ton pasokan</strong> dipindahkan paksa menggunakan kereta kuda menuju gudangnya.<br><br>
            <em>Ini adalah bukti "Mekanisme Fisik" yang nyata. Data tidak berpindah sendiri melainkan ada aksi fisik penggerak.</em>
          </div>
        `
      );
    }

    let c3TimelineState = 1;
    function viewTimelineAudit() {
      playSound('buku');
      addLog("Menyusun rantai kronologi sebab-akibat.");
      c3TimelineState = 1;
      showModal(
        "Papan Rekonstruksi: Susun Rantai Sebab-Akibat",
        `
          <p>Susun 4 peristiwa di bawah dari <strong>Pemicu Awal</strong> hingga <strong>Dampak Akhir</strong> (Klik secara berurutan):</p>
          
          <div style="display:flex; flex-direction:column; gap:8px; margin:14px 0;">
            <button class="quiz-option" id="ev-report" onclick="selectTimelineStep('REPORT')">📜 Rekayasa Grafik: Laporan statistik dipotong di angka 50</button>
            <button class="quiz-option" id="ev-plot" onclick="selectTimelineStep('PLOT')">🤝 Persekongkolan: Rapat rahasia monopoli pangan di kediaman Adipati</button>
            <button class="quiz-option" id="ev-famine" onclick="selectTimelineStep('FAMINE')">🚨 Dampak Nyata: Kelaparan dan kelangkaan gandum melanda desa-desa</button>
            <button class="quiz-option" id="ev-raid" onclick="selectTimelineStep('RAID')">📦 Eksekusi Lapangan: Pasokan 212 ton diangkut paksa ke Ibukota</button>
          </div>

          <div id="c3-tl-feedback" class="book-card" style="border-left-color:var(--accent-gold);">
            Langkah 1: Tentukan peristiwa mana yang menjadi titik awal pemicu segalanya?
          </div>
        `,
        "Tutup",
        () => closeModal()
      );
    }

    function selectTimelineStep(type) {
      const sequence = ['PLOT', 'RAID', 'REPORT', 'FAMINE'];
      if (type === sequence[c3TimelineState - 1]) {
        playSound('correct');
        const btn = document.getElementById('ev-' + type.toLowerCase());
        btn.style.borderColor = "var(--accent-green)";
        btn.style.background = "rgba(34, 197, 94, 0.2)";
        btn.disabled = true;

        c3TimelineState++;
        if (c3TimelineState > 4) {
          gameState.c3.ready = true;
          renderChapter3Hotspots();
          document.getElementById('c3-tl-feedback').style.borderLeftColor = "var(--accent-green)";
          document.getElementById('c3-tl-feedback').innerHTML = `
            <strong style="color:var(--accent-green);">✨ Rantai Kausalitas Sah Terbukti:</strong><br>
            Persekongkolan ➔ Pengalihan Fisik ➔ Penutupan Grafik ➔ Kelaparan Rakyat.<br><br>
            <em>Sidang Vonis di Singgasana Raja [ ★ ] kini telah TERBUKA!</em>
          `;
          addLog("Kronologi kausalitas berhasil direkonstruksi dengan tepat. Sidang terbuka.");
        } else {
          document.getElementById('c3-tl-feedback').innerHTML = `<span style="color:var(--accent-green);">Urutan ${c3TimelineState - 1} tepat! Pilih peristiwa logis berikutnya (Tahap ${c3TimelineState})...</span>`;
        }
      } else {
        playSound('wrong');
        updateSiri(-5);
        document.getElementById('c3-tl-feedback').innerHTML = `<span style="color:var(--accent-red);">Keliru! Peristiwa ini tidak dapat terjadi pada tahapan ke-${c3TimelineState}. Teliti alur sebab dan akibatnya. (-5% Siri')</span>`;
      }
    }

    function openChapter3Quiz() {
      if (!gameState.c3.ready) {
        playSound('wrong');
        showModal(
          "Sidang Terkunci",
          `<div class="book-card" style="border-left-color:var(--accent-red);">
            Susun rantai peristiwa pada berkas <strong>[ ! Rekonstruksi Kausalitas ]</strong> terlebih dahulu sebelum menghadap Raja!
          </div>`
        );
        return;
      }

      playSound('buku');
      if (gameState.c3.stage === 1) {
        showModal(
          "Evaluasi Tahap 1: Arah Waktu",
          `
            <p>Mungkinkah kelaparan rakyat di masa akhir yang menjadi penyebab Adipati menyita lumbung pasokan di awal waktu?</p>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mungkin1')">A. Mungkin, karena kedua peristiwa terjadi dalam periode waktu yang sama.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mustahil')">B. Mustahil, karena akibat di masa depan tidak bisa mendahului sebabnya.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'mungkin2')">C. Mungkin, asalkan ada saksi mata di pengadilan.</button>
            <button class="quiz-option" onclick="submitC3Quiz(1, 'pasti')">D. Pasti, peristiwa besar selalu memicu peristiwa masa lalu.</button>
          `,
          "Tutup"
        );
      } else if (gameState.c3.stage === 2) {
        showModal(
          "Evaluasi Tahap 2: Korelasi vs Kausalitas",
          `
            <p>Adipati berkilah bahwa krisis pangan hanyalah kebetulan (korelasi semu) bersamaan dengan musim kemarau. Bukti apa yang menggugurkan alibinya?</p>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'kausalitas')">A. Adanya surat perintah pengangkutan fisik (mekanisme nyata pengikat).</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'otomatis')">B. Semua kejadian berurutan otomatis saling menjadi penyebab.</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'firasat')">C. Firasat dan dugaan emosional warga desa.</button>
            <button class="quiz-option" onclick="submitC3Quiz(2, 'bersama')">D. Dua hal buruk yang terjadi bersamaan pasti saling memicu.</button>
          `,
          "Tutup"
        );
      } else {
        showModal(
          "Evaluasi Tahap 3: Kesimpulan",
          `
            <p>Berdasarkan bukti mekanisme fisik dan prinsip urutan waktu, siapakah dalang utama penyebab hancurnya Siri' Kerajaan?</p>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah1')">A. Rakyat desa yang panik dan menciptakan krisis suasana.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah2')">B. Pejabat pembuat grafik yang sekadar menggambar laporan.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'benar')">C. Adipati yang menyita dan memindahkan pasokan ke gudangnya.</button>
            <button class="quiz-option" onclick="submitC3Quiz(3, 'salah3')">D. Cuaca buruk yang kebetulan melanda daerah luar.</button>
          `,
          "Tutup"
        );
      }
    }

    function submitC3Quiz(stage, choice) {
      if (stage === 1) {
        if (choice === 'mustahil') {
          playSound('correct');
          gameState.c3.stage = 2;
          addLog("Tahap 1 Berhasil: Urutan waktu dipahami.");
          showModal("Logika Kronologis Sah!", `<div class="book-card" style="border-left-color: var(--accent-green);">Tepat! Waktu hanya berjalan maju. Syarat utama Kausalitas adalah <strong>Sebab harus mendahului akibat</strong>.</div>`, "Lanjut ke Tahap 2", () => openChapter3Quiz());
        } else {
          playSound('wrong');
          if (updateSiri(-10)) return;
          let reason = "Waktu tidak berjalan mundur. Kejadian akibat di masa akhir tidak mungkin menjadi pemicu tindakan awal.";
          addLog("Tahap 1 keliru.");
          showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
        }
      } else if (stage === 2) {
        if (choice === 'kausalitas') {
          playSound('correct');
          gameState.c3.stage = 3;
          addLog("Tahap 2 Berhasil: Kausalitas dibuktikan.");
          showModal("Alibi Dipatahkan!", `<div class="book-card" style="border-left-color: var(--accent-green);">Luar biasa! Urutan waktu yang tepat ditambah <strong>mekanisme fisik pengikat</strong> mengonfirmasi Kausalitas sejati.</div>`, "Lanjut ke Kesimpulan", () => openChapter3Quiz());
        } else {
          playSound('wrong');
          if (updateSiri(-10)) return;
          let reason = "Korelasi semu memerlukan mekanisme fisik penghubung agar sah diakui sebagai kausalitas.";
          addLog("Tahap 2 keliru.");
          showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
        }
      } else {
        if (choice === 'benar') {
          gameState.c3.solved = true;
          clearInterval(gameState.timerInterval);
          gameState.savedTimeSec = (gameState.savedTimeSec || 0) + gameState.timerSec;
          addLog("Bab 3 Selesai: Vonis dijatuhkan.");

          triggerStampEffect(() => {
            playSound('correct');
            showModal(
              "Vonis Ditegakkan!",
              `<div class="book-card" style="border-left-color: var(--accent-green);">
                Sempurna! Dengan stempel bukti sah, Adipati resmi dijatuhi hukuman dan seluruh pasokan pangan dikembalikan ke rakyat yang berhak.
              </div>`,
              "Buka Kemenangan ➔",
              () => { closeModal(); loadOutro(); }
            );
          });
        } else {
          playSound('wrong');
          if (updateSiri(-10)) return;
          let reason = "";
          if (choice === 'salah1') reason = "Rakyat yang menderita hanyalah korban (Akibat akhir), bukan penyebab masalah.";
          if (choice === 'salah2') reason = "Pembuat grafik hanya menutupi kejahatan yang sudah terjadi, bukan pemicu utama.";
          if (choice === 'salah3') reason = "Cuaca buruk hanyalah alibi kebetulan untuk menutupi penyitaan.";
          addLog("Tahap 3 keliru.");
          showModal("Penjelasan Pilihan:", `<div class="book-card" style="border-left-color:var(--accent-red);">${reason}</div>`, "Coba Lagi", () => openChapter3Quiz());
        }
      }
    }

    function triggerStampEffect(callback) {
      playSound('stamp');
      const stampEl = document.createElement('div');
      stampEl.className = 'stamp-overlay';
      stampEl.innerText = 'BUKTI SAH';
      document.body.appendChild(stampEl);

      setTimeout(() => {
        stampEl.remove();
        if (callback) callback();
      }, 800);
    }

    /* =========================================================
       5. OUTRO
       ========================================================= */
    function loadOutro() {
      stopBGM();
      gameState.chapter = "outro";
      chapterDisplay.innerText = "Selesai: Penghakiman";
      
      const totalSaved = gameState.savedTimeSec || 0;
      const totalAllocatedSec = 3 * 8 * 60; 
      const usedSec = Math.max(0, totalAllocatedSec - totalSaved);

      const usedM = String(Math.floor(usedSec / 60)).padStart(2, "0");
      const usedS = String(usedSec % 60).padStart(2, "0");

      timerDisplay.innerText = `Waktu: ${usedM}:${usedS}`;
      
      sceneCanvas.classList.add("hidden");
      logPanel.classList.add("hidden");
      gameBody.classList.add("full-width-body");

      let title = "";
      let titleColor = "";
      let feedback = "";

      if (gameState.siri === 0) {
        title = "Integritas Runtuh (Gagal)";
        titleColor = "var(--accent-red)";
        feedback = "Kecurangan menang. Kesucian Siri' kerajaan hancur akibat banyaknya kesalahan analisis.";
      } else if (gameState.siri >= 10 && gameState.siri <= 30) {
        title = "Penyelidik Ceroboh";
        titleColor = "#f87171";
        feedback = "Kasus terselesaikan dengan susah payah. Banyak bukti dan kausalitas yang sempat salah ditafsirkan.";
      } else if (gameState.siri >= 40 && gameState.siri <= 60) {
        title = "Pemberantas Bias Pemula";
        titleColor = "#fde047";
        feedback = "Analisis cukup baik. Kamu berhasil melihat trik manipulasi grafik dan pencilan data.";
      } else if (gameState.siri >= 70 && gameState.siri <= 80) {
        title = "Penjaga Kebenaran Data";
        titleColor = "var(--accent-cyan)";
        feedback = "Sangat tajam! Manipulasi sumbu dan pemalsuan waktu berhasil dibongkar dengan bukti kokoh.";
      } else {
        title = "Penyelidik Mahir Siri'";
        titleColor = "var(--accent-gold)";
        feedback = "Luar biasa tanpa cela! Integritas Siri' terjaga murni dan keadilan statistik tegak sempurna di seluruh kerajaan.";
      }

      let badgesHTML = "";
      let earnedBadges = [];

      if (gameState.siri === 100) {
        earnedBadges.push(`
          <div class="badge-card">
            <span class="badge-icon">🦅</span>
            <div style="text-align: left;">
              <div class="badge-title">Mata Rajawali</div>
              <div class="badge-desc">Menjawab sempurna tanpa satupun kesalahan (Siri' 100%).</div>
            </div>
          </div>
        `);
      }

      if (usedSec <= 600) {
        earnedBadges.push(`
          <div class="badge-card">
            <span class="badge-icon">⚡</span>
            <div style="text-align: left;">
              <div class="badge-title">Penyelidik Gesit</div>
              <div class="badge-desc">Deduksi kilat! Menyelesaikan seluruh investigasi hanya dalam waktu ${usedM}:${usedS}.</div>
            </div>
          </div>
        `);
      }

      if (earnedBadges.length > 0) {
        badgesHTML = `
          <div style="margin-top: 14px;">
            <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Lencana Penghargaan Diperoleh:</div>
            <div class="badges-container">
              ${earnedBadges.join("")}
            </div>
          </div>
        `;
      }

      leftPanel.innerHTML = `
        <div class="intro-hero-panel" style="text-align: center;">
          <div class="intro-content">
            <h2 style="color: var(--accent-green); margin-bottom: 8px; font-family:'Segoe UI', sans-serif;">🎉 Kemakmuran Kerajaan Pulih</h2>
            
            <div class="book-card" style="border-left-color: ${titleColor}; background: rgba(15,23,42,0.95); max-width: 600px; margin: 0 auto 16px auto; text-align: left;">
              <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Evaluasi Penyelidik:</div>
              <div style="font-size: 1.25rem; font-weight: bold; color: ${titleColor}; margin: 4px 0 6px 0;">
                ★ ${title} ★
              </div>
              <div style="font-size: 0.92rem; color: #f8fafc; margin-bottom: 6px;">
                Sisa Nilai Siri': <strong style="color: ${titleColor};">${gameState.siri}%</strong> | Waktu Digunakan: <strong>${usedM}:${usedS}</strong>
              </div>
              <p style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; margin: 0;">
                ${feedback}
              </p>
              ${badgesHTML}
            </div>

            <div class="book-card" style="text-align: left; max-width: 600px; margin: 0 auto 16px auto;">
              <strong>Buku Catatan Literasi Data Selesai Ditulis:</strong><br><br>
              • <strong>Bab 1:</strong> Memahami sebaran data, menghitung rentang, dan mendeteksi bahaya angka <strong>Pencilan (Outlier)</strong>.<br><br>
              • <strong>Bab 2:</strong> Membongkar manipulasi pemotongan skala grafik, serta mengutamakan nilai <strong>Median</strong>.<br><br>
              • <strong>Bab 3:</strong> Membuktikan <strong>Kausalitas (Sebab-Akibat)</strong> dengan memastikan mekanisme fisik dan urutan kronologis yang sah.
            </div>

            <button class="btn-action" onclick="loadIntro()" style="max-width: 240px; margin: 0 auto;">Tutup Buku Catatan ➔</button>
          </div>
        </div>
      `;
    }

    loadIntro();
  </script>
</body>
</html>
