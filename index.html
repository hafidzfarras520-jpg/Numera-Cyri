<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numera Cyri — Investigasi Literasi Data</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent-cyan: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --border-color: #334155;
      --parchment-bg: #131d31;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

.median-bar {
      border-radius: 4px; cursor: pointer; transition: filter 0.2s, transform 0.2s;
    }
    .median-bar:hover {
      filter: brightness(1.3); transform: scaleY(1.2) translateX(2px);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
        .screen-flash {
      position: fixed; inset: 0; background: white; opacity: 0;
      pointer-events: none; z-index: 99999; transition: opacity 0.05s ease-out;
    }
    .flash-active { opacity: 0.85; }

    @keyframes shakeScreen {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
    }
    .shake { animation: shakeScreen 0.3s ease-in-out; }

    /* Layout Utama */
    .game-container {
      width: 100%; max-width: 920px; background: rgba(30, 41, 59, 0.95);
      border: 2px solid var(--border-color); border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    /* Top Bar & Health Bar */
    .top-bar {
      background: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 2px solid var(--border-color); flex-wrap: wrap; gap: 10px;
    }
    .top-bar h1 { font-size: 1.2rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; font-weight: 600; margin:0;}
    .stats-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-family: 'Segoe UI', sans-serif; }

    .siri-hp-container {
      display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.8);
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color);
    }
    .hp-bar-track { width: 120px; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .hp-bar-fill { height: 100%; width: 100%; background: var(--accent-green); transition: width 0.35s ease, background-color 0.35s ease; }

    .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; border: 1px solid transparent; }
    .badge-timer { background: rgba(239, 68, 68, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
    .badge-chapter { background: rgba(251, 191, 36, 0.15); border-color: var(--accent-gold); color: var(--accent-gold); }

    /* Scene Area */
    .scene-box {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background-size: cover;
      background-position: center; border-bottom: 2px solid var(--border-color); overflow: hidden;
    }

    body.critical-siri { filter: brightness(0.85); transition: filter 0.5s ease; }
    body.critical-siri::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      box-shadow: inset 0 0 80px 20px rgba(239, 68, 68, 0.3); animation: pulseVignette 2s infinite ease-in-out;
    }
    @keyframes pulseVignette { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    .hotspot {
      position: absolute; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; background: transparent !important; transition: background 0.2s;
    }
    .hotspot:hover { background: rgba(56, 189, 248, 0.15) !important; }
    .hotspot-label {
      background: rgba(15, 23, 42, 0.9); color: var(--accent-cyan); font-weight: bold; font-size: 0.85rem;
      padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.4); pointer-events: none;
      white-space: nowrap; font-family: 'Segoe UI', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .quiz-hotspot .hotspot-label { color: var(--accent-gold); border-color: rgba(251, 191, 36, 0.6); }
    .quiz-hotspot.locked { opacity: 0.6; }
    .quiz-hotspot.locked .hotspot-label { color: #94a3b8; border-color: #64748b; background: rgba(15, 23, 42, 0.95); }
.drag-bag {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
      background: #1e293b; border: 2px solid #64748b; color: #f8fafc; border-radius: 6px;
      cursor: pointer; font-weight: 500; font-size: 0.85rem; user-select: none;
      transition: all 0.2s;
    }
    .drag-bag:active { transform: scale(0.95); }
    .drop-box {
      border: 2px dashed #475569; background: rgba(15, 23, 42, 0.4); border-radius: 8px; padding: 12px;
      min-height: 80px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: all 0.2s;
      cursor: pointer;
    }
    .drop-box:hover, .drop-box:active { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.1); }
    /* Layout Panel Bawah */
    .game-body { padding: 16px 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    .full-width-body { grid-template-columns: 1fr; }

    .status-panel, .log-panel {
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 14px; font-size: 0.9rem; line-height: 1.5;
    }
    .log-panel h3 { font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .log-list { list-style: none; max-height: 100px; overflow-y: auto; font-size: 0.8rem; color: #94a3b8; }
    .log-list li { padding: 5px 0; border-bottom: 1px dashed #334155; line-height: 1.4; }
    .log-list li:first-child { color: var(--accent-cyan); }

    .intro-hero-panel { position: relative; border-radius: 10px; padding: 24px; overflow: hidden; border: 1px solid rgba(251, 191, 36, 0.3); }
    .intro-hero-panel::before {
      content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('Bg.png');
      background-size: cover; background-position: center; filter: blur(4px); transform: scale(1.05); z-index: 0;
    }
    .intro-content { position: relative; z-index: 1; }

    .btn-action {
      background: var(--accent-cyan); color: #0f172a; border: none; padding: 12px 18px; border-radius: 8px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.2s; width: 100%; font-family: 'Segoe UI', sans-serif;
    }
    .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 7, 19, 0.85); backdrop-filter: blur(4px); display: flex;
      justify-content: center; align-items: center; padding: 16px; z-index: 100;
    }
    .modal-box {
      background: var(--parchment-bg); border: 1px solid var(--border-color); border-top: 4px solid var(--accent-cyan); border-radius: 12px; max-width: 650px;
      width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }

    .book-card {
      background: rgba(15, 23, 42, 0.6); border-left: 4px solid var(--accent-cyan); padding: 14px 16px;
      border-radius: 6px; margin: 12px 0; font-size: 0.95rem; line-height: 1.5; color: #e2e8f0;
    }

    /* Kuis Klasik (A/B/C/D) */
    .quiz-option {
      background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 12px 16px;
      border-radius: 8px; font-size: 0.92rem; text-align: left; cursor: pointer; width: 100%; margin-top: 10px;
      transition: background 0.2s, border-color 0.2s; line-height: 1.4;
    }
    .quiz-option:hover { background: #1e293b; border-color: var(--accent-cyan); }

    .hidden { display: none !important; }
    
    .stamp-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg) scale(3);
      border: 6px double #22c55e; color: #22c55e; font-family: 'Segoe UI Black', 'Arial Black', sans-serif;
      font-size: 2.5rem; letter-spacing: 4px; padding: 10px 24px; text-transform: uppercase; border-radius: 8px;
      background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); pointer-events: none;
      z-index: 10000; opacity: 0; animation: stampSlam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes stampSlam {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-25deg) scale(3.5); }
      80% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1); }
    }

    .badges-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 14px 0; }
    .badge-card {
      background: rgba(15, 23, 42, 0.9); border: 1px solid var(--accent-gold); border-radius: 6px; padding: 6px 10px;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
    }
    .badge-icon { font-size: 1.3rem; }
    .badge-title { font-weight: bold; color: var(--accent-gold); font-size: 0.8rem; }
    .badge-desc { font-size: 0.7rem; color: #94a3b8; }

    /* Drag and Drop Karung (Visual Profesional) */
    .drag-bag {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
      background: #1e293b; border: 1px solid #64748b; color: #f8fafc; border-radius: 6px;
      cursor: grab; font-weight: 500; font-size: 0.85rem; user-select: none; touch-action: none;
    }
    .drag-bag:active { cursor: grabbing; opacity: 0.7; }
    .drop-box {
      border: 2px dashed #475569; background: rgba(15, 23, 42, 0.4); border-radius: 8px; padding: 12px;
      min-height: 60px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: all 0.2s;
    }
    .drop-box.drag-over { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.1); }
  </style>
</head>
<body>

  <div class="game-container" id="game-container">
    <header class="top-bar">
      <h1>📖 Numera Cyri</h1>
      <div class="stats-bar">
        <div class="siri-hp-container">
          <span style="font-size:0.8rem; font-weight:bold; color:var(--accent-cyan);" id="siri-text">Siri': 100%</span>
          <div class="hp-bar-track"><div class="hp-bar-fill" id="hp-bar-fill"></div></div>
        </div>
        <div class="badge badge-timer" id="timer-display">Waktu: 08:00</div>
        <div class="badge badge-chapter" id="chapter-display">Intro</div>
      </div>
    </header>

    <div class="scene-box" id="scene-canvas"></div>

    <main class="game-body" id="game-body">
      <div id="left-panel"></div>
      <aside class="log-panel" id="log-panel">
        <h3>Catatan Analisis</h3>
        <ul class="log-list" id="journal-log"><li>Investigasi dimulai.</li></ul>
      </aside>
    </main>
  </div>

  <div class="modal-overlay hidden" id="modal-popup">
    <div class="modal-box">
      <h2 id="modal-title" style="color:var(--accent-cyan); font-size: 1.25rem; margin-bottom:10px; font-family:'Segoe UI', sans-serif; border-bottom: 1px solid #334155; padding-bottom: 8px;">Arsip Dokumen</h2>
      <div id="modal-body"></div>
      <div id="modal-footer" style="margin-top:20px;">
        <button class="btn-action" id="modal-close-btn" onclick="closeModal()">Tutup Lembaran</button>
      </div>
    </div>
  </div>

  <script>
    const sounds = {
      bgm: new Audio('bgm.mp4'), gameOver: new Audio('gameover.mp4'), correct: new Audio('correct.mp4'),
      wrong: new Audio('wrong.mp4'), buku: new Audio('buku.mp4'), grafik: new Audio('grafik.mp4'),
      lampu: new Audio('lampu.mp4'), stamp: new Audio('stamp.mp4'), clear: new Audio('clear.mp4')
    };
    sounds.bgm.loop = true; sounds.bgm.volume = 0.9;
    sounds.clear.loop = true; 
    sounds.clear.volume = 0.55;
    function playSound(name) { if (sounds[name]) { sounds[name].currentTime = 0; sounds[name].play().catch(() => {}); } }
    function playBGM() { sounds.bgm.play().catch(() => {}); }
    function stopBGM() { sounds.bgm.pause(); sounds.bgm.currentTime = 0; }
function stopClear() { sounds.clear.pause(); sounds.clear.currentTime = 0; }
    function triggerShake() {
      const container = document.getElementById("game-container");
      container.classList.add("shake");
      setTimeout(() => container.classList.remove("shake"), 300);
    }

    function triggerStampEffect(callback) {
      playSound('stamp');
      const stampEl = document.createElement('div');
      stampEl.className = 'stamp-overlay'; stampEl.innerText = 'EVALUASI SAH';
      document.body.appendChild(stampEl);
      setTimeout(() => { stampEl.remove(); if (callback) callback(); }, 1000);
    }

    const gameState = {
      chapter: "intro", siri: 100, timerSec: 480, timerInterval: null, hintTimeout: null, savedTimeSec: 0,
      c1: { bagSorted: false, rangeLearned: false, ready: false, stage: 1 },
      c2: { graphFixed: false, medianLearned: false, ready: false, stage: 1 },
      c3: { auditRead: false, timelineFixed: false, ready: false, stage: 1 }
    };

    const sceneCanvas = document.getElementById("scene-canvas");
    const leftPanel = document.getElementById("left-panel");
    const journalLog = document.getElementById("journal-log");
    const siriText = document.getElementById("siri-text");
    const hpBarFill = document.getElementById("hp-bar-fill");
    const timerDisplay = document.getElementById("timer-display");
    const chapterDisplay = document.getElementById("chapter-display");
    const modalPopup = document.getElementById("modal-popup");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalCloseBtn = document.getElementById("modal-close-btn");

    function addLog(text) {
      const li = document.createElement("li"); li.innerText = `[${new Date().toLocaleTimeString()}] ${text}`; journalLog.prepend(li);
    }

    function updateSiri(amount) {
      gameState.siri = Math.max(0, Math.min(100, gameState.siri + amount));
      siriText.innerText = `Siri': ${gameState.siri}%`;
      hpBarFill.style.width = `${gameState.siri}%`;

      if (gameState.siri > 50) hpBarFill.style.backgroundColor = "var(--accent-green)";
      else if (gameState.siri >= 30) hpBarFill.style.backgroundColor = "var(--accent-gold)";
      else hpBarFill.style.backgroundColor = "var(--accent-red)";
      
      if (gameState.siri < 40 && gameState.siri > 0) document.body.classList.add("critical-siri");
      else document.body.classList.remove("critical-siri");

      if (amount < 0) {
        triggerShake();
        if (gameState.siri <= 0) {
          document.body.classList.remove("critical-siri"); stopBGM(); playSound('gameOver');
          clearInterval(gameState.timerInterval); clearTimeout(gameState.hintTimeout);
          showModal(
            "<span style='color:var(--accent-red);'>Siri' Runtuh! Game Over</span>",
            `<div class="book-card" style="border-left-color:var(--accent-red);">Integritas analisis hancur akibat terlalu banyak kesalahan logika. Penyelidikan dihentikan.</div>`,
            "Ulangi Investigasi ↺", () => { closeModal(); loadIntro(); }
          );
          return true;
        }
      }
      return false;
    }

    function startTimer(minutes, onExpire) {
      clearInterval(gameState.timerInterval); gameState.timerSec = minutes * 60;
      gameState.timerInterval = setInterval(() => {
        gameState.timerSec--;
        const m = String(Math.floor(gameState.timerSec / 60)).padStart(2, "0");
        const s = String(gameState.timerSec % 60).padStart(2, "0");
        timerDisplay.innerText = `Waktu: ${m}:${s}`;
        if (gameState.timerSec <= 0) {
          clearInterval(gameState.timerInterval); stopBGM(); playSound('gameOver');
          showModal("<span style='color:var(--accent-red);'>Waktu Habis!</span>", `<div class="book-card" style="border-left-color:var(--accent-red);">Waktu evaluasi telah habis. Fakta gagal diungkap.</div>`, "Ulangi Investigasi ↺", () => { closeModal(); loadIntro(); });
        }
      }, 1000);
    }

    function showModal(title, htmlContent, customBtnText = "Tutup", onBtnClick = null) {
      modalTitle.innerHTML = title; modalBody.innerHTML = htmlContent;
      if(customBtnText === "NONE") {
        document.getElementById('modal-footer').style.display = 'none';
      } else {
        document.getElementById('modal-footer').style.display = 'block';
        modalCloseBtn.innerText = customBtnText;
        modalCloseBtn.onclick = () => { if (onBtnClick) onBtnClick(); else closeModal(); };
      }
      modalPopup.classList.remove("hidden");
    }

    function closeModal() { modalPopup.classList.add("hidden"); }

    /* =========================================================
       1. INTRO
       ========================================================= */
  function loadIntro() {
      stopClear();
      
      document.body.classList.remove("critical-siri"); gameState.chapter = "intro"; gameState.siri = 100;
      gameState.savedTimeSec = 0;
      gameState.c1 = { bagSorted: false, rangeLearned: false, ready: false, stage: 1 };
      gameState.c2 = { graphFixed: false, medianLearned: false, ready: false, stage: 1 };
      gameState.c3 = { auditRead: false, timelineFixed: false, ready: false, stage: 1 };
      clearInterval(gameState.timerInterval); clearTimeout(gameState.hintTimeout);
      
      updateSiri(0); chapterDisplay.innerText = "Pendahuluan"; timerDisplay.innerText = "Waktu: --:--";
      sceneCanvas.classList.add("hidden"); document.getElementById('log-panel').classList.add("hidden");
      document.getElementById('game-body').classList.add("full-width-body");

      // TAHAP 1: KONTEKS CERITA
      leftPanel.innerHTML = `
        <div class="intro-hero-panel">
          <div class="intro-content">
            <h2 style="color:var(--accent-gold); font-size:1.5rem; margin-bottom:16px;">Buku Catatan Numera Cyri</h2>
            
            <div class="vn-dialogue-box" style="margin-bottom:12px; border-color:var(--accent-cyan);">
              <div class="vn-avatar">📜</div>
              <div>
                <div class="vn-speaker" style="color:var(--accent-cyan);">Latar Belakang Kasus</div>
                <div class="vn-text">"Krisis kelaparan tiba-tiba melanda desa-desa pinggiran. Anehnya, laporan statistik resmi dari Adipati Wilayah Pusat mengklaim bahwa pasokan pangan kerajaan sangat melimpah dan adil. Pasti ada sesuatu yang dimanipulasi di balik angka-angka tersebut."</div>
              </div>
            </div>

            <div class="vn-dialogue-box" style="margin-bottom:16px; border-color:var(--accent-red);">
              <div class="vn-avatar">🕵️</div>
              <div>
                <div class="vn-speaker" style="color:var(--accent-red);">Misi Penyelidik (Kamu)</div>
                <div class="vn-text">"Raja memanggilmu sebagai Analis Data Independen. Tugasmu: Periksa data mentah di lumbung, bongkar ilusi manipulasi grafik sang Adipati, dan buktikan kejahatannya di meja persidangan!"</div>
              </div>
            </div>

            <button class="btn-action" onclick="showIntroGuide()" style="margin-top:14px; padding:14px;">Lanjut Membaca Petunjuk ➔</button>
          </div>
        </div>
      `;
    }

    // TAHAP 2: PETUNJUK BERMAIN
    function showIntroGuide() {
      playSound('click'); // Memutar SFX klik (opsional)
      leftPanel.innerHTML = `
        <div class="intro-hero-panel">
          <div class="intro-content">
            <h2 style="color:var(--accent-gold); font-size:1.5rem; margin-bottom:16px;">Petunjuk Investigasi</h2>

            <div class="book-card" style="border-left-color: var(--accent-gold); background:rgba(15,23,42,0.9); font-size:0.9rem;">
              <strong>Siri'</strong> adalah prinsip harga diri dan kejujuran mutlak terhadap fakta. 
              Jagalah <strong>Bilah Integritas Siri'</strong> milikmu agar tidak terkuras habis akibat kesalahan analisis dalam batas waktu <strong>8 Menit</strong> per bab.
            </div>

            <div class="book-card" style="border-left-color: var(--accent-green); background:rgba(15,23,42,0.85); font-size:0.9rem;">
              <strong>Langkah Investigasi:</strong>
              <br>1. Buka <strong>Alat Praktik Lapangan [ ! ]</strong> untuk mengklasifikasi data mentah.
              <br>2. Pelajari <strong>Analisis Teori [ ! ]</strong> mengenai prinsip logika statistika.
              <br>3. Gunakan temuanmu di meja <strong>Evaluasi Sidang [ ★ ]</strong> untuk mematahkan argumen Adipati!
            </div>

            <div style="display:flex; gap:10px; margin-top:16px;">
              <button class="btn-action" onclick="loadIntro()" style="background:#334155; color:#f8fafc; flex:1;">⬅ Kembali</button>
              <button class="btn-action" onclick="loadChapter1()" style="flex:2;">Terima Misi & Buka Berkas ➔</button>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       2. BAB 1: SEBARAN DATA & PENCILAN (OUTLIER)
       ========================================================= */
    function loadChapter1() {
      playBGM(); gameState.chapter = "c1"; 
      chapterDisplay.innerText = "Bab 1"; sceneCanvas.classList.remove("hidden");
      document.getElementById('log-panel').classList.remove("hidden"); document.getElementById('game-body').classList.remove("full-width-body");
      sceneCanvas.style.backgroundImage = "url('11.png')";

      addLog("Bab 1: Analisis Sebaran Data."); startTimer(8);
      leftPanel.innerHTML = `<div class="status-panel"><strong>Petunjuk:</strong> Lakukan klasifikasi karung pasokan dan pelajari teori rentang pada berkas <strong style="color:var(--accent-cyan);">[ ! ]</strong>, lalu buka <strong style="color:var(--accent-gold);">[ ★ ] Evaluasi</strong>.</div>`;
      checkC1Ready();
    }

    function checkC1Ready() {
      if (gameState.c1.bagSorted && gameState.c1.rangeLearned && !gameState.c1.ready) {
        gameState.c1.ready = true; addLog("Fakta matematis ditemukan. Evaluasi terbuka!");
      }
      renderC1Hotspots();
    }

    function renderC1Hotspots() {
      const cls = gameState.c1.ready ? "" : "locked";
      const lbl = gameState.c1.ready ? "★ Evaluasi Bab 1" : "🔒 Evaluasi (Terkunci)";

    function handleTapDrop(targetZone) {
      if (!selectedBagId) return; // Abaikan jika belum memilih karung apa-apa
      const bagEl = document.getElementById(selectedBagId);
      const val = parseInt(bagEl.getAttribute('data-val'));

      if (targetZone === 'normal' && val === 212) { 
        playSound('wrong'); updateSiri(-5); 
        document.getElementById('c1-feedback').innerHTML = `<span style="color:var(--accent-red);">Keliru! 212 Ton terlalu janggal dibanding lainnya. (-5%)</span>`; 
        return; 
      }
      if (targetZone === 'outlier' && val !== 212) { 
        playSound('wrong'); updateSiri(-5); 
        document.getElementById('c1-feedback').innerHTML = `<span style="color:var(--accent-red);">Keliru! ${val} Ton berada di kelompok stabil. (-5%)</span>`; 
        return; 
      }
      
      // Pindahkan elemen karung ke kotak tujuan
      document.getElementById(targetZone + '-zone').appendChild(bagEl);
      
      // KUNCI KARUNG: Matikan highlight dan matikan pointer agar klik tembus ke kotak
      bagEl.style.borderColor = 'var(--accent-green)';
      bagEl.style.background = 'rgba(34, 197, 94, 0.1)';
      bagEl.style.pointerEvents = 'none'; // <-- Membuat klik tembus ke kotak di bawahnya
      bagEl.style.cursor = 'default';
      
      selectedBagId = null;
      playSound('correct');
      
      if (document.getElementById('normal-zone').children.length === 4 && document.getElementById('outlier-zone').children.length === 1) {
        gameState.c1.bagSorted = true; checkC1Ready();
        // FEEDBACK NUMERASI KUAT

          • Rata-rata 4 wilayah stabil (kiri) adalah <strong>47 Ton</strong>.<br>
          • Namun, jika digabung dengan anomali 212 Ton (kanan), Rata-rata Total melesat menjadi <strong>80 Ton!</strong><br>
          <em>(Total 400 Ton dibagi 5 wilayah = 80 Ton).</em>

        }
      } else if (stage === 2) {
        if (choice === 'kausalitas') {
          playSound('correct'); gameState.c3.stage = 3; addLog("Vonis 2: Alibi alam digugurkan.");
          showModal("Tepat!", `<div class="book-card" style="border-left-color:var(--accent-green);">Dua kejadian insidental belum tentu saling berefek. Namun, eksistensi rekam jejak <strong>mekanisme fisik yang menggerakkannya secara paksa</strong> membuktikan hubungan itu adalah Kausalitas absolut.</div>`, "Bacakan Keputusan ➔", () => openChapter3Quiz());
        } else {
          playSound('wrong'); if (updateSiri(-10)) return; addLog("Vonis 2 keliru.");
          showModal("Analisis Keliru", `<div class="book-card" style="border-left-color:var(--accent-red);">Korelasi semu (kebetulan) baru bisa runtuh saat dihadapkan pada bukti keterlibatan 'alat penggerak' yang nyata. Pahami substansi tindakan aktif tersebut. (-10% Siri')</div>`, "Coba Lagi", () => openChapter3Quiz());
        }
      } else {
        if (choice === 'benar') {
          gameState.c3.solved = true; 
          
          clearInterval(gameState.timerInterval); 
          clearTimeout(gameState.hintTimeout);
          
          gameState.savedTimeSec += gameState.timerSec; addLog("Investigasi Selesai. Vonis Sah.");
          triggerStampEffect(() => {
            showModal("VONIS AKHIR DITEGAKKAN!", `<div class="book-card" style="border-left-color:var(--accent-green);">Dengan pembongkaran bias rata-rata, pemulihan skala median grafik, dan penegakan prinsip kausalitas tanpa celah... Kebohongan elit dihempaskan dan alur pasokan dinormalkan!</div>`, "Buka Catatan Penyelidik ➔", () => { closeModal(); loadOutro(); });
          });
        } else {
          playSound('wrong'); if (updateSiri(-10)) return; addLog("Vonis 3 keliru.");
          showModal("Analisis Keliru", `<div class="book-card" style="border-left-color:var(--accent-red);">Jangan terdistraksi! Pelaku korporat bawahan (pembuat grafik) maupun narasi eksternal alam (cuaca) bukanlah penggerak inti dari monopoli nilai pangan tersebut. (-10% Siri')</div>`, "Coba Lagi", () => openChapter3Quiz());
        }
      }
    }
    /* =========================================================
       5. OUTRO
       ========================================================= */
function loadOutro() {
  clearInterval(gameState.timerInterval); 
      clearTimeout(gameState.hintTimeout);
      stopBGM(); 
      playSound('clear'); // <--- SFX CLEAR DIPUTAR SAAT MASUK OUTRO
      
      gameState.chapter = "outro"; chapterDisplay.innerText = "Selesai";
      const usedSec = Math.max(0, (3 * 8 * 60) - (gameState.savedTimeSec || 0));
      timerDisplay.innerText = `Waktu: ${String(Math.floor(usedSec/60)).padStart(2,"0")}:${String(usedSec%60).padStart(2,"0")}`;
      sceneCanvas.classList.add("hidden"); document.getElementById('log-panel').classList.add("hidden");
      document.getElementById('game-body').classList.add("full-width-body");

      let title = "Analis Data Utama", titleColor = "var(--accent-gold)", fb = "Luar biasa tanpa celah! Objektivitas statistika dan prinsip penalaran logika tegak sempurna, membongkar manipulasi sistematis di kerajaan.";
      if (gameState.siri <= 30) { title = "Penyelidik Subjektif"; titleColor = "#f87171"; fb = "Kasus ini berhasil dituntaskan namun dengan kecerobohan tinggi. Fakta matematis kerap kali salah dipersepsikan."; }
      else if (gameState.siri <= 60) { title = "Analis Muda Potensial"; titleColor = "#fde047"; fb = "Usaha yang patut diapresiasi. Ada pemahaman yang baik mengenai landasan teori namun terkadang keliru menyimpulkan fakta yang tersamarkan."; }
      else if (gameState.siri <= 80) { title = "Penjaga Integritas Bukti"; titleColor = "var(--accent-cyan)"; fb = "Metodologi yang sangat rapi! Jebakan distorsi visual grafik dan bias ukuran pemusatan dipatahkan dengan presisi yang mengagumkan."; }

      let badges = [];
      if (gameState.siri === 100) badges.push(`<div class="badge-card"><span class="badge-icon">🦅</span><div><div class="badge-title">Mata Rajawali</div><div class="badge-desc">Siri' 100% (Menjawab sempurna tanpa kesalahan penalaran).</div></div></div>`);
      if (usedSec <= 600) badges.push(`<div class="badge-card"><span class="badge-icon">⚡</span><div><div class="badge-title">Penyelidik Gesit</div><div class="badge-desc">Total durasi deduksi penyelesaian sangat prima (≤ 10 Menit).</div></div></div>`);

      leftPanel.innerHTML = `
        <div class="intro-hero-panel" style="text-align: center;">
          <div class="intro-content">
            <h2 style="color: var(--accent-green); margin-bottom: 12px; font-size:1.6rem;">🎉 Integritas Kebenaran Siri' Berhasil Dipulihkan!</h2>
            <div class="book-card" style="border-left-color: ${titleColor}; background: rgba(15,23,42,0.95); text-align:left;">
              <div style="font-size:0.8rem; color:#94a3b8; text-transform:uppercase; font-weight:bold;">Predikat Penguasaan Literasi Data:</div>
              <div style="font-size:1.35rem; font-weight:bold; color:${titleColor}; margin:6px 0;">★ ${title} ★</div>
              <div style="font-size:0.95rem; margin-bottom:8px; border-bottom: 1px dashed #475569; padding-bottom:8px;">Sisa Integritas Siri': <strong style="color:${titleColor};">${gameState.siri}%</strong> | Total Akumulasi Waktu: <strong>${String(Math.floor(usedSec/60)).padStart(2,"0")}:${String(usedSec%60).padStart(2,"0")}</strong></div>
              <p style="font-size:0.9rem; color:#cbd5e1; line-height:1.5;">${fb}</p>
              ${badges.length ? `<div class="badges-container" style="margin-top:14px;">${badges.join('')}</div>` : ''}
            </div>

            <div class="book-card" style="text-align: left; max-width: 600px; margin: 0 auto 16px auto; font-size:0.88rem;">
              <strong>Rangkuman Pengetahuan Metodologi Buku Catatan Numera Cyri:</strong><br><br>
              • <strong>Bab 1 (Identifikasi Pencilan):</strong> Ukuran Rata-rata (Mean) sangat rentan bias; ia bisa menyembunyikan ketimpangan realitas karena secara mudah tertarik menutupi/mengatrol dominasi angka yang ekstrem (Pencilan/Outlier).<br><br>
              • <strong>Bab 2 (Distorsi Visual):</strong> Memotong sumbu grafik vertikal adalah trik modifikasi penipuan visual. Dalam menyikapi asimetri semacam itu, <strong>Median (Nilai Tengah)</strong> lebih jujur mewakili massa sebab posisinya kebal terhadap tarikan anomali persentase di tepi data.<br><br>
              • <strong>Bab 3 (Validasi Korelatif):</strong> Dua hal yang berjalan beriringan <strong>(Korelasi)</strong> tidak selamanya mensyaratkan satu hal memicu yang lain <strong>(Kausalitas)</strong>. Kondisi sebab-akibat hanya dibenarkan jika hukum arah waktu bergeser sekuensial (sebab duluan, akibat belakangan) disokong keterlibatan medium aksi fisik nyata yang mengikat mekanismenya.
            </div>

            <button class="btn-action" onclick="loadIntro()" style="max-width:240px; margin:0 auto; padding:14px 20px;">Tutup Buku Catatan Penyelidik ➔</button>
          </div>
        </div>
      `;
    }

    loadIntro();
  </script>
</body>
